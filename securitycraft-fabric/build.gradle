plugins {
	id 'fabric-loom' version '1.11.8'
	id 'java'
}

version = "${project.mod_version}+fabric"
group = 'net.geforcemods'
base.archivesName = 'SecurityCraft'

java {
	toolchain.languageVersion = JavaLanguageVersion.of(21)
	withSourcesJar()
}

repositories {
	maven {
		url = 'https://api.modrinth.com/maven'
		content { includeGroup 'maven.modrinth' }
	}
}

loom {
	accessWidenerPath = file('src/main/resources/securitycraft.accesswidener')
	mixin {
		defaultRefmapName = 'securitycraft.refmap.json'
	}
}

sourceSets.main.resources {
	srcDir 'src/generated/resources'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.mc_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "maven.modrinth:forge-config-api-port:${project.forge_config_api_port_version}"
	//javax.annotation.Nullable and friends, which NeoForge puts on the classpath
	compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
	//optional: camera view compatibility with Sodium's chunk tracking (Sodium's API is the same from 0.6 to 0.8 for this)
	modCompileOnly 'maven.modrinth:sodium:mc1.21.1-0.6.13-fabric'
	//optional: recipe viewer (JEI) and block info HUD (Jade) integration, loaded through their fabric.mod.json entrypoints
	modCompileOnly "maven.modrinth:jei:${project.jei_version}"
	modCompileOnly "maven.modrinth:jade:${project.jade_version}"
	//development runs only, to test the integrations in game
	modLocalRuntime "maven.modrinth:jei:${project.jei_version}"
	modLocalRuntime "maven.modrinth:jade:${project.jade_version}"
	//Forge Config API Port ships NightConfig as nested jars, which Loom does not put on the development classpath
	implementation 'com.electronwill.night-config:core:3.8.0'
	implementation 'com.electronwill.night-config:toml:3.8.0'
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 21
	options.compilerArgs << '-Xmaxerrs' << '100000'
}

jar {
	from('LICENSE') {
		rename { "${it}_SecurityCraft" }
	}
}
